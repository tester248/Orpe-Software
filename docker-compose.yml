version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: orpe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db_orpe_consultants
      MYSQL_ROOT_HOST: '%'
    command: --lower_case_table_names=1 --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Dump20251205:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - orpe-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orpe-app
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_orpe_consultants?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orpe-network
    restart: on-failure

volumes:
  mysql_data:

networks:
  orpe-network:
    driver: bridge
